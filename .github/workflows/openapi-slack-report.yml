name: OpenAPI Slack Report

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Slack report target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stg
          - prod
      deploy_wait_seconds:
        description: Seconds to wait before downloading deployed OpenAPI spec
        required: true
        default: "0"

jobs:
  openapi-change-report:
    name: OpenAPI Change Report
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }}
    permissions:
      contents: write
      actions: read
    concurrency:
      group: openapi-baseline-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Set report variables
        id: vars
        env:
          TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }}
        run: |
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"

          case "$TARGET_ENV" in
            dev)
              echo "baseline_path=dev/endpoints.json" >> "$GITHUB_OUTPUT"
              echo "raw_baseline_path=dev/openapi.json" >> "$GITHUB_OUTPUT"
              echo "artifact_name=openapi-change-report-dev" >> "$GITHUB_OUTPUT"
              echo "title_prefix=[DEV]" >> "$GITHUB_OUTPUT"
              ;;
            stg)
              echo "baseline_path=stg/endpoints.json" >> "$GITHUB_OUTPUT"
              echo "raw_baseline_path=stg/openapi.json" >> "$GITHUB_OUTPUT"
              echo "artifact_name=openapi-change-report-stg" >> "$GITHUB_OUTPUT"
              echo "title_prefix=[STG]" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "baseline_path=prod/endpoints.json" >> "$GITHUB_OUTPUT"
              echo "raw_baseline_path=prod/openapi.json" >> "$GITHUB_OUTPUT"
              echo "artifact_name=openapi-change-report-prod" >> "$GITHUB_OUTPUT"
              echo "title_prefix=[PROD]" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported target environment: $TARGET_ENV"
              exit 1
              ;;
          esac

      - name: Wait for deployed service
        env:
          DEPLOY_WAIT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_wait_seconds || '900' }}
          EXPECTED_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          DEV_HEALTH_CHECK_URL: ${{ secrets.DEV_HEALTH_CHECK_URL || vars.DEV_HEALTH_CHECK_URL || 'https://shoemoa-backend.onrender.com/healthz' }}
        run: |
          if [ "$DEPLOY_WAIT_SECONDS" -le 0 ]; then
            exit 0
          fi

          if [ -z "$EXPECTED_COMMIT_SHA" ]; then
            echo "Waiting ${DEPLOY_WAIT_SECONDS}s before downloading OpenAPI spec."
            sleep "$DEPLOY_WAIT_SECONDS"
            exit 0
          fi

          echo "Waiting up to ${DEPLOY_WAIT_SECONDS}s for Render deploy commit ${EXPECTED_COMMIT_SHA}."
          deadline=$((SECONDS + DEPLOY_WAIT_SECONDS))

          while [ "$SECONDS" -lt "$deadline" ]; do
            health_json="$(curl -fsSL "$DEV_HEALTH_CHECK_URL" || true)"
            deployed_commit="$(printf '%s' "$health_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"

            if [ "$deployed_commit" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Render deploy is ready: ${deployed_commit}"
              exit 0
            fi

            echo "Waiting for Render deploy... current=${deployed_commit:-unknown}"
            sleep 10
          done

          echo "::error::Render deploy did not reach expected commit within ${DEPLOY_WAIT_SECONDS}s."
          exit 1

      - name: Check OpenAPI baseline branch
        id: baseline_branch
        run: |
          if git ls-remote --exit-code --heads origin openapi-baseline >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout OpenAPI baseline
        if: steps.baseline_branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: openapi-baseline
          path: baseline

      - name: Initialize OpenAPI baseline
        if: steps.baseline_branch.outputs.exists != 'true'
        run: |
          mkdir -p baseline
          git -C baseline init
          git -C baseline remote add origin "$(git config --get remote.origin.url)"
          if git config --local --get http.https://github.com/.extraheader >/dev/null; then
            git -C baseline config http.https://github.com/.extraheader "$(git config --local --get http.https://github.com/.extraheader)"
          fi
          git -C baseline checkout --orphan openapi-baseline

      - name: Restore previous catalog baseline
        id: baseline_file
        env:
          BASELINE_PATH: ${{ steps.vars.outputs.baseline_path }}
          RAW_BASELINE_PATH: ${{ steps.vars.outputs.raw_baseline_path }}
        run: |
          mkdir -p openapi/review/catalog
          if [ -f "baseline/$BASELINE_PATH" ]; then
            cp "baseline/$BASELINE_PATH" openapi/review/catalog/endpoints.json
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "baseline/$RAW_BASELINE_PATH" ]; then
            mkdir -p openapi/review/source
            cp "baseline/$RAW_BASELINE_PATH" openapi/review/source/previous-openapi.json
          fi

      - name: Download deployed OpenAPI spec
        env:
          TARGET_ENV: ${{ steps.vars.outputs.target_env }}
          DEV_OAS_URL: ${{ secrets.DEV_OAS_URL || vars.DEV_OAS_URL || 'https://shoemoa-backend.onrender.com/v3/api-docs' }}
          STG_OAS_URL: ${{ secrets.STG_OAS_URL || vars.STG_OAS_URL }}
          PROD_OAS_URL: ${{ secrets.PROD_OAS_URL || vars.PROD_OAS_URL }}
          OAS_AUTH_HEADER: ${{ secrets.OAS_AUTH_HEADER }}
          DEV_OAS_AUTH_HEADER: ${{ secrets.DEV_OAS_AUTH_HEADER }}
          STG_OAS_AUTH_HEADER: ${{ secrets.STG_OAS_AUTH_HEADER }}
          PROD_OAS_AUTH_HEADER: ${{ secrets.PROD_OAS_AUTH_HEADER }}
        run: |
          case "$TARGET_ENV" in
            dev)
              OAS_URL="$DEV_OAS_URL"
              ENV_AUTH_HEADER="$DEV_OAS_AUTH_HEADER"
              ;;
            stg)
              OAS_URL="$STG_OAS_URL"
              ENV_AUTH_HEADER="$STG_OAS_AUTH_HEADER"
              ;;
            prod)
              OAS_URL="$PROD_OAS_URL"
              ENV_AUTH_HEADER="$PROD_OAS_AUTH_HEADER"
              ;;
          esac

          AUTH_HEADER="${ENV_AUTH_HEADER:-$OAS_AUTH_HEADER}"

          if [ -z "$OAS_URL" ]; then
            echo "::error::OpenAPI URL secret is empty for target environment: $TARGET_ENV"
            exit 1
          fi

          case "$OAS_URL" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "::error::OpenAPI URL must point to a deployed server, not localhost: $OAS_URL"
              exit 1
              ;;
          esac

          mkdir -p openapi/_internal/source

          for attempt in $(seq 1 20); do
            if [ -n "$AUTH_HEADER" ]; then
              curl -fsSL -H "$AUTH_HEADER" "$OAS_URL" -o openapi/_internal/source/openapi.json && exit 0
            else
              curl -fsSL "$OAS_URL" -o openapi/_internal/source/openapi.json && exit 0
            fi

            echo "Waiting for deployed OpenAPI spec... attempt=${attempt}"
            sleep 5
          done

          echo "::error::Failed to download deployed OpenAPI spec"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate OpenAPI change report
        run: npx --yes openapi-projector catalog

      - name: Detect OpenAPI changes
        id: changes
        env:
          BASELINE_EXISTS: ${{ steps.baseline_file.outputs.exists }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const changes = JSON.parse(fs.readFileSync('openapi/changes.json', 'utf8'));
          const added = Array.isArray(changes.added) ? changes.added.length : 0;
          const removed = Array.isArray(changes.removed) ? changes.removed.length : 0;
          const contractChanged = Array.isArray(changes.contractChanged)
            ? changes.contractChanged.length
            : 0;
          const docChanged = Array.isArray(changes.docChanged) ? changes.docChanged.length : 0;
          const count = added + removed + contractChanged + docChanged;
          const hasBaseline = process.env.BASELINE_EXISTS === 'true';
          const shouldNotify = hasBaseline && changes.baseline !== true && count > 0;
          const shouldNotifyBaseline = !hasBaseline;

          console.log(`changed=${shouldNotify ? 'true' : 'false'}`);
          console.log(`baseline_initialized=${shouldNotifyBaseline ? 'true' : 'false'}`);
          console.log(`summary=+${added} / -${removed} / contract ${contractChanged} / doc ${docChanged}`);
          NODE

      - name: Upload full OpenAPI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: |
            openapi/changes.md
            openapi/changes.json
            openapi/_internal/source/openapi.json
            openapi/review/source/previous-openapi.json
          if-no-files-found: ignore

      - name: Send Slack report
        if: steps.changes.outputs.changed == 'true' || steps.changes.outputs.baseline_initialized == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHANGE_SUMMARY: ${{ steps.changes.outputs.summary }}
          TITLE_PREFIX: ${{ steps.vars.outputs.title_prefix }}
          BASELINE_INITIALIZED: ${{ steps.changes.outputs.baseline_initialized }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret is required when OpenAPI changes are detected."
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const changes = JSON.parse(fs.readFileSync('openapi/changes.json', 'utf8'));
          const currentCatalog = fs.existsSync('openapi/review/catalog/endpoints.json')
            ? JSON.parse(fs.readFileSync('openapi/review/catalog/endpoints.json', 'utf8'))
            : null;
          const catalogEndpoints = Array.isArray(currentCatalog?.endpoints)
            ? currentCatalog.endpoints
            : [];
          const catalogById = new Map(catalogEndpoints.map((entry) => [entry.id, entry]));
          const catalogByOperation = new Map(
            catalogEndpoints.map((entry) => [
              `${String(entry.method || '').toUpperCase()} ${entry.path}`,
              entry,
            ])
          );
          const baselineInitialized = process.env.BASELINE_INITIALIZED === 'true';
          const added = Array.isArray(changes.added) ? changes.added : [];
          const removed = Array.isArray(changes.removed) ? changes.removed : [];
          const contractChanged = Array.isArray(changes.contractChanged)
            ? changes.contractChanged
            : [];
          const docChanged = Array.isArray(changes.docChanged) ? changes.docChanged : [];
          const title = baselineInitialized
            ? `${process.env.TITLE_PREFIX} OpenAPI 기준선 생성`
            : `${process.env.TITLE_PREFIX} OpenAPI 변경 감지`;

          const maxItems = 8;
          const maxRowsPerKind = 4;
          const maxPayloadLength = 3800;
          const commit = (process.env.COMMIT_SHA || process.env.GITHUB_SHA || '').slice(0, 7);
          const lines = [
            `${baselineInitialized ? '🧭' : '🚨'} *${title}*`,
            '',
            `*요약* 🆕 Added \`${added.length}\`  🗑️ Removed \`${removed.length}\`  🧩 Contract \`${contractChanged.length}\`  📝 Doc \`${docChanged.length}\``,
            `- 전체 엔드포인트: \`${changes.total ?? '-'}\``,
          ];

          if (commit) {
            lines.push(`- 커밋: \`${commit}\``);
          }

          if (process.env.ACTIONS_RUN_URL) {
            lines.push(`- 상세 리포트: <${process.env.ACTIONS_RUN_URL}|GitHub Actions artifact>`);
          }

          function escapeSlack(value) {
            return String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
          }

          function compact(value, maxLength = 180) {
            const text = escapeSlack(value).replace(/\s+/g, ' ').trim();
            return text.length > maxLength ? `${text.slice(0, maxLength - 3)}...` : text;
          }

          function endpointLabel(item) {
            const method = String(item.method || '').toUpperCase();
            const summary = item.summary ? ` - ${compact(item.summary, 80)}` : '';
            return `\`${method}\` \`${compact(item.path, 120)}\`${summary}`;
          }

          function addEndpointSection(icon, title, items) {
            if (!Array.isArray(items) || items.length === 0) {
              return;
            }

            lines.push('', `*${icon} ${title}* \`${items.length}건\``);
            for (const item of items.slice(0, maxItems)) {
              lines.push(`• ${endpointLabel(item)}`);
            }

            if (items.length > maxItems) {
              lines.push(`• 외 ${items.length - maxItems}건은 Actions artifact에서 확인`);
            }
          }

          function stripFormatting(value) {
            return String(value ?? '')
              .replace(/\\`/g, '`')
              .replace(/`/g, '')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function rowKind(row) {
            if (String(row?.previous ?? '').trim() === '없음') {
              return 'added';
            }

            if (String(row?.next ?? '').trim() === '없음') {
              return 'removed';
            }

            return 'changed';
          }

          function parseParameterLocation(row) {
            const target = stripFormatting(row?.target);
            const match = target.match(/parameters\["([^"]+)"\]/);
            if (!match) {
              return null;
            }

            return match[1].split('.')[0] || null;
          }

          function inferParameterLocation(row) {
            const parsedLocation = parseParameterLocation(row);
            const category = String(row?.category ?? '');

            if (parsedLocation) {
              return parsedLocation;
            }
            if (category === 'Query Parameter') {
              return 'query';
            }
            if (category === 'Path Parameter') {
              return 'path';
            }
            if (category === 'Header Parameter') {
              return 'header';
            }
            if (category === 'Cookie Parameter') {
              return 'cookie';
            }

            return null;
          }

          function locationLabel(row) {
            const category = String(row?.category ?? '');
            const parsedLocation = inferParameterLocation(row);

            if (parsedLocation === 'query' || category === 'Query Parameter') {
              return '요청 Query 파라미터';
            }
            if (parsedLocation === 'path' || category === 'Path Parameter') {
              return '요청 Path 파라미터';
            }
            if (parsedLocation === 'header' || category === 'Header Parameter') {
              return '요청 Header 파라미터';
            }
            if (parsedLocation === 'cookie' || category === 'Cookie Parameter') {
              return '요청 Cookie 파라미터';
            }
            if (category.includes('Request/Response Body')) {
              return '요청/응답 Body 필드';
            }
            if (category.includes('Request Body/Header')) {
              return '요청 Body/Header 필드';
            }
            if (category.includes('Response Body/Header')) {
              return '응답 Body/Header 필드';
            }
            if (category.includes('Request Body')) {
              return '요청 Body 필드';
            }
            if (category.includes('Response Body')) {
              return '응답 Body 필드';
            }
            if (category.includes('Request Header')) {
              return '요청 Header 필드';
            }
            if (category.includes('Response Header')) {
              return '응답 Header 필드';
            }
            if (category === 'Response') {
              return '응답';
            }
            if (category === 'Documentation') {
              return '문서';
            }
            return '계약';
          }

          function fieldName(row) {
            const target = stripFormatting(row?.target)
              .replace(/^operation\.parameters\["[^"]+"\]\.?/, '')
              .replace(/^schema\./, '');
            const parameterMatch = stripFormatting(row?.target).match(/parameters\["([^"]+)"\]/);
            if (parameterMatch) {
              return parameterMatch[1].split('.').slice(1).join('.') || parameterMatch[1];
            }

            const withoutRequired = target.replace(/\.required$/, '');
            const parts = withoutRequired.split('.');
            return parts.at(-1) || 'value';
          }

          function catalogEntryFor(item) {
            if (item?.id && catalogById.has(item.id)) {
              return catalogById.get(item.id);
            }

            const key = `${String(item?.method || '').toUpperCase()} ${item?.path}`;
            return catalogByOperation.get(key) ?? null;
          }

          function schemaRefName(ref) {
            return String(ref ?? '').split('/').at(-1) || null;
          }

          function javaTypeFromSchema(schema) {
            if (!schema || typeof schema !== 'object') {
              return null;
            }

            if (typeof schema.$ref === 'string') {
              return schemaRefName(schema.$ref);
            }

            if (Array.isArray(schema.enum)) {
              return 'String';
            }

            if (schema.type === 'array') {
              return `List<${javaTypeFromSchema(schema.items) ?? 'Object'}>`;
            }

            if (schema.type === 'string') {
              if (schema.format === 'uuid') {
                return 'UUID';
              }
              if (schema.format === 'date') {
                return 'LocalDate';
              }
              if (schema.format === 'date-time') {
                return 'OffsetDateTime';
              }
              if (schema.format === 'binary') {
                return 'MultipartFile';
              }
              return 'String';
            }

            if (schema.type === 'integer') {
              return schema.format === 'int64' ? 'Long' : 'Integer';
            }

            if (schema.type === 'number') {
              if (schema.format === 'float') {
                return 'Float';
              }
              if (schema.format === 'double') {
                return 'Double';
              }
              return 'BigDecimal';
            }

            if (schema.type === 'boolean') {
              return 'Boolean';
            }

            if (schema.type === 'object') {
              return 'Map<String, Object>';
            }

            return null;
          }

          function inferredJavaType(item, row) {
            const entry = catalogEntryFor(item);
            const snapshot = entry?.contractSnapshot;
            const parameterLocation = inferParameterLocation(row);
            const name = fieldName(row);

            if (parameterLocation) {
              const parameter = (snapshot?.operation?.parameters ?? []).find((candidate) =>
                candidate?.in === parameterLocation && candidate?.name === name
              );
              return javaTypeFromSchema(parameter?.schema);
            }

            const target = stripFormatting(row?.target).replace(/\.required$/, '');
            const [schemaName, ...propertyParts] = target.split('.');
            const propertyName = propertyParts.join('.');
            if (schemaName && propertyName) {
              return javaTypeFromSchema(
                snapshot?.referencedSchemas?.[schemaName]?.properties?.[propertyName]
              );
            }

            return null;
          }

          function parseValueSummary(value) {
            const raw = stripFormatting(value);
            const parts = raw.split(',').map((part) => part.trim()).filter(Boolean);
            const typePart = parts.find((part) =>
              !['required', 'optional', 'nullable', 'true', 'false', '없음'].includes(part) &&
              !part.startsWith('format=')
            );
            const formatPart = parts.find((part) => part.startsWith('format='));

            return {
              raw,
              type: typePart ?? null,
              format: formatPart ? formatPart.slice('format='.length) : null,
              required: parts.includes('required') ? true : parts.includes('optional') ? false : null,
              nullable: parts.includes('nullable'),
            };
          }

          function javaTypeFromSummary(summary) {
            const type = summary.type;
            if (!type) {
              return 'Object';
            }

            if (type.endsWith('[]')) {
              return `List<${javaTypeFromSummary({ ...summary, type: type.slice(0, -2) })}>`;
            }

            if (type.startsWith('enum(')) {
              return 'String';
            }

            if (type === 'string') {
              if (summary.format === 'uuid') {
                return 'UUID';
              }
              if (summary.format === 'date') {
                return 'LocalDate';
              }
              if (summary.format === 'date-time') {
                return 'OffsetDateTime';
              }
              if (summary.format === 'binary') {
                return 'MultipartFile';
              }
              return 'String';
            }

            if (type === 'integer') {
              return summary.format === 'int64' ? 'Long' : 'Integer';
            }

            if (type === 'number') {
              if (summary.format === 'float') {
                return 'Float';
              }
              if (summary.format === 'double') {
                return 'Double';
              }
              return 'BigDecimal';
            }

            if (type === 'boolean') {
              return 'Boolean';
            }

            if (type === 'object') {
              return 'Map<String, Object>';
            }

            if (['unknown', 'oneOf', 'anyOf', 'allOf'].includes(type)) {
              return 'Object';
            }

            return type;
          }

          function modifierComment(kind, row, summary) {
            if (kind === 'changed') {
              const previousSummary = parseValueSummary(row.previous);
              const nextSummary = parseValueSummary(row.next);
              const previous = previousSummary.raw;
              const next = nextSummary.raw;

              if (
                previousSummary.type &&
                previousSummary.type === nextSummary.type &&
                previousSummary.nullable !== nextSummary.nullable
              ) {
                return nextSummary.nullable ? ' // nullable 추가' : ' // nullable 제거';
              }

              if (
                previousSummary.type &&
                previousSummary.type === nextSummary.type &&
                previousSummary.required !== null &&
                nextSummary.required !== null &&
                previousSummary.required !== nextSummary.required
              ) {
                const previousRequired = previousSummary.required ? 'required' : 'optional';
                const nextRequired = nextSummary.required ? 'required' : 'optional';
                return ` // ${previousRequired} → ${nextRequired}`;
              }

              return previous && next ? ` // ${previous} → ${next}` : '';
            }

            const flags = [];
            if (summary.required === true) {
              flags.push('required');
            } else if (summary.required === false) {
              flags.push('optional');
            }
            if (summary.nullable) {
              flags.push('nullable');
            }
            return flags.length > 0 ? ` // ${flags.join(', ')}` : '';
          }

          function javaDeclaration(kind, row, item) {
            const source = kind === 'removed' ? row.previous : row.next;
            const summary = parseValueSummary(source);
            const name = fieldName(row);
            const comment = modifierComment(kind, row, summary);
            const inferredType = inferredJavaType(item, row);
            const hasKnownType = Boolean(summary.type || inferredType);
            const declaration = hasKnownType
              ? `${summary.type ? javaTypeFromSummary(summary) : inferredType} ${name};${comment}`
              : `${name};${comment}`;
            return kind === 'removed' ? `~${declaration}~` : declaration;
          }

          function contractKindLabel(kind) {
            const meta = {
              added: ['🟢', '추가'],
              changed: ['🟡', '변경'],
              removed: ['🔴', '삭제'],
            }[kind];
            return `${meta[0]} ${meta[1]}`;
          }

          function tableCell(value) {
            return compact(value, 140).replace(/\|/g, '/');
          }

          function sortedContractRows(rows) {
            const order = { removed: 0, changed: 1, added: 2 };
            return [...rows].sort((left, right) => order[rowKind(left)] - order[rowKind(right)]);
          }

          function addContractSection(items) {
            if (!Array.isArray(items) || items.length === 0) {
              return;
            }

            lines.push('', `*🧩 Contract Changed* \`${items.length}건\``);
            for (const item of items.slice(0, maxItems)) {
              lines.push(`• ${endpointLabel(item)}`);

              const rows = Array.isArray(item.comparisonRows) ? item.comparisonRows : [];
              if (item.detailsUnavailable) {
                lines.push('  ⚪ 상세 비교는 다음 기준선부터 표시됩니다.');
                continue;
              }

              if (rows.length === 0) {
                lines.push('  ⚪ 상세 비교 행 없음. Actions artifact에서 원문을 확인하세요.');
                continue;
              }

              const visibleRows = sortedContractRows(rows).slice(0, maxRowsPerKind * 3);
              for (const row of visibleRows) {
                const kind = rowKind(row);
                lines.push(
                  `  ${contractKindLabel(kind)} | ${tableCell(locationLabel(row))} | ${tableCell(javaDeclaration(kind, row, item))}`
                );
              }

              if (rows.length > visibleRows.length) {
                lines.push(`  • 외 ${rows.length - visibleRows.length}건은 Actions artifact에서 확인`);
              }
            }

            if (items.length > maxItems) {
              lines.push(`• 외 ${items.length - maxItems}개 엔드포인트는 Actions artifact에서 확인`);
            }
          }

          function addDocSection(items) {
            if (!Array.isArray(items) || items.length === 0) {
              return;
            }

            lines.push('', `*📝 Doc Changed* \`${items.length}건\``);
            for (const item of items.slice(0, maxItems)) {
              lines.push(`• ${endpointLabel(item)}`);
              const rows = Array.isArray(item.comparisonRows) ? item.comparisonRows : [];
              for (const row of rows.slice(0, 3)) {
                lines.push(`  • ${locationLabel(row)} ${fieldName(row)}: ${compact(row.previous, 80)} → ${compact(row.next, 80)}`);
              }
              if (rows.length > 3) {
                lines.push(`  • 외 ${rows.length - 3}건은 Actions artifact에서 확인`);
              }
            }

            if (items.length > maxItems) {
              lines.push(`• 외 ${items.length - maxItems}개 엔드포인트는 Actions artifact에서 확인`);
            }
          }

          addEndpointSection('🆕', 'Added', added);
          addEndpointSection('🗑️', 'Removed', removed);
          addContractSection(contractChanged);
          addDocSection(docChanged);

          lines.push('', '상세 내용은 Actions artifact의 `changes.md`와 `changes.json`에서 확인하세요.');

          let message = lines.join('\n');
          if (message.length > maxPayloadLength) {
            message = `${message.slice(0, maxPayloadLength - 80)}\n\n... 전체 내용은 Actions artifact에서 확인하세요.`;
          }

          const payload = {
            text: message,
          };

          fs.writeFileSync('slack-payload.json', JSON.stringify(payload));
          NODE

          curl -fsSL \
            -X POST \
            -H "Content-Type: application/json" \
            --data @slack-payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Update OpenAPI baseline
        env:
          TARGET_ENV: ${{ steps.vars.outputs.target_env }}
          BASELINE_PATH: ${{ steps.vars.outputs.baseline_path }}
          RAW_BASELINE_PATH: ${{ steps.vars.outputs.raw_baseline_path }}
        run: |
          BASELINE_DIR="$(dirname "$BASELINE_PATH")"
          mkdir -p "baseline/$BASELINE_DIR"
          RAW_BASELINE_DIR="$(dirname "$RAW_BASELINE_PATH")"
          mkdir -p "baseline/$RAW_BASELINE_DIR"

          cp openapi/review/catalog/endpoints.json "baseline/$BASELINE_PATH"
          cp openapi/_internal/source/openapi.json "baseline/$RAW_BASELINE_PATH"

          cd baseline
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BASELINE_PATH" "$RAW_BASELINE_PATH"

          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi

          git commit -m "chore(openapi): ${TARGET_ENV} 기준선 갱신"
          git push origin HEAD:openapi-baseline
